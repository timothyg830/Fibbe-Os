<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fibbe OS</title><meta name="description" content="Fibbe OS: a desktop operating system that runs in your browser."><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">
<style>
:root{--bg:#eef0fb;--card:#fff;--tx:#14162b;--mut:#6b6f8a;--ac:#7c5cff;--line:#d6d9ef;--wp1:#8fa6ff;--wp2:#e49bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-os="dark"]{--bg:#161936;--card:#1f2347;--tx:#f2f3ff;--mut:#9a9ec4;--line:#303566;--wp1:#1b1f4f;--wp2:#5b2a86;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
#os{position:fixed;inset:0;background:#000}
.full{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center}
.logo{font-size:72px;font-weight:800;letter-spacing:-3px;background:linear-gradient(135deg,var(--ac),#ff6ec7);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot{background:#000;color:#fff}
.pb{width:260px;height:5px;background:#ffffff26;border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#ff6ec7);animation:fill 3.2s ease-in-out forwards}
@keyframes fill{to{width:100%}}
#setup{background:linear-gradient(135deg,var(--wp1),var(--wp2))}
.wiz{width:min(92vw,520px);background:var(--bg);border-radius:18px;padding:30px;box-shadow:0 30px 80px #0006;text-align:left;display:flex;flex-direction:column;gap:12px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h1{font-size:26px}h2{font-size:17px;margin:6px 0}p,.mut{color:var(--mut);font-size:14px;line-height:1.45}
button.b{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer}
button.b.s{padding:5px 12px;font-size:12px}button.b.g{background:var(--line);color:var(--tx)}
input,textarea,select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;margin:4px 0;user-select:text}
.opt{padding:12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}.opt.on{border-color:var(--ac)}
#desk{background:linear-gradient(135deg,var(--wp1),var(--wp2))}
#icons{position:absolute;top:10px;left:10px;bottom:56px;display:flex;flex-direction:column;flex-wrap:wrap;gap:6px;align-content:flex-start}
.di{width:84px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:10px;font-size:12px;color:#fff;text-shadow:0 1px 3px #000a;cursor:pointer;text-align:center}
.di:hover{background:#ffffff30}.di i,.ai{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;font-style:normal;box-shadow:0 3px 8px #0004}
#tb{position:absolute;left:0;right:0;bottom:0;height:48px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);display:flex;align-items:center;gap:6px;padding:0 10px;border-top:1px solid var(--line);z-index:99999}
#tb .st{background:linear-gradient(135deg,var(--ac),#ff6ec7);color:#fff;border:0;border-radius:10px;width:38px;height:34px;font-weight:800;cursor:pointer;font-size:16px}
.tbb{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tbb.on{border-color:var(--ac)}
#sp{flex:1}#clk{font-size:12px;text-align:right;line-height:1.3;padding:0 6px}
#sm{position:absolute;left:10px;bottom:56px;width:340px;max-height:70%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:none;flex-direction:column;gap:8px;z-index:99998;box-shadow:0 20px 50px #0006}
#sm.on{display:flex}#sl{overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.si{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 2px;border-radius:8px;cursor:pointer}.si:hover{background:var(--line)}
.win{position:absolute;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px #0006;display:flex;flex-direction:column;overflow:hidden;min-width:300px;min-height:200px;resize:both}
.win.max{inset:0 0 48px 0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.tt{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;background:var(--card);cursor:move;font-size:13px;font-weight:600;flex:none}
.tt span button{background:none;border:0;color:var(--tx);width:30px;height:26px;border-radius:6px;cursor:pointer;font-size:14px}.tt span button:hover{background:var(--line)}.tt span button.x:hover{background:#ef4444;color:#fff}
.wb{flex:1;overflow:auto;padding:14px;user-select:text}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin:7px 0;border:1px solid var(--line)}.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.calc button{padding:14px 0;font-size:18px;border:0;border-radius:10px;background:var(--card);color:var(--tx);cursor:pointer}.calc button.o{background:var(--ac);color:#fff}
#disp{font-size:36px;text-align:right;padding:16px 6px;min-height:70px;word-break:break-all}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0}
.cell{aspect-ratio:1;font-size:34px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--tx);cursor:pointer}
.keys{display:flex;height:170px;margin-top:10px}.keys div{flex:1;background:#fff;border:1px solid #888;border-radius:0 0 8px 8px;color:#222;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:11px;cursor:pointer}.keys div:active{background:var(--ac);color:#fff}
canvas{width:100%;background:#fff;border-radius:10px;touch-action:none;border:1px solid var(--line)}
#toast{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:999999}#toast.on{opacity:1}
#kb{position:absolute;left:50%;bottom:56px;transform:translate(-50%,20px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:8px;opacity:0;pointer-events:none;transition:.2s;z-index:100002;display:flex;flex-direction:column;gap:4px}
#kb.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.kr{display:flex;gap:4px;justify-content:center}
.kk{min-width:34px;height:34px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;color:var(--tx)}
.kk.w{min-width:58px}.kk.sp{min-width:300px}.kk.hit{background:var(--ac);color:#fff;transform:translateY(2px)}
.win.fs{inset:0!important;width:auto!important;height:auto!important;border-radius:0;resize:none;z-index:100001!important}
body.fsm #tb,body.fsm #sm{display:none!important}
#icons{top:0;left:0;right:0;bottom:48px;display:block}
.di{position:absolute;touch-action:none;cursor:grab}.di:active{cursor:grabbing}
.tt{cursor:grab}.tt:active{cursor:grabbing}
</style></head>
<body><div id="os"></div><div id="toast"></div>
<script>
const os=document.getElementById('os'),$=s=>document.querySelector(s);
let S=null;try{S=JSON.parse(localStorage.getItem('fibbe-d2'))}catch(e){}
S=S||{done:0,name:'',theme:'dark',ac:'#7c5cff',inst:['settings','store','browser','mail','notes','calc','clock'],wifi:[],conn:'',mail:'',pin:'',priv:{loc:1,diag:0,ads:0}};S.wifi=S.wifi||[];S.priv=S.priv||{loc:1,diag:0,ads:0};
const save=()=>{try{localStorage.setItem('fibbe-d2',JSON.stringify(S))}catch(e){}};
function skin(){document.documentElement.dataset.os=S.theme;document.documentElement.style.setProperty('--ac',S.ac)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// id,name,emoji,color,category,description,kind,platform
const A=[
['settings','Settings','⚙️','#6b7280','System','Customize Fibbe.','real','Fibbe'],
['store','Fibbe Store','🛍️','#7c5cff','System','Get apps.','real','Fibbe'],
['notes','Notes','📝','#f5b942','Productivity','Write things down.','real','Android + iOS'],
['calc','Calculator','🧮','#ff7a45','Tools','Quick maths.','real','Android + iOS'],
['clock','Clock','⏰','#3b82f6','Tools','Time and stopwatch.','real','Android + iOS'],
['paint','Sketchpad','🎨','#ec4899','Creative','Draw with your mouse.','real','Android + iOS'],
['ttt','Tic-Tac-Toe','⭕','#10b981','Games','Beat the bot.','real','Android + iOS'],
['todo','Tasks','✅','#22c55e','Productivity','Simple to-do list.','real','Android + iOS'],
['piano','Piano','🎹','#8b5cf6','Music','Play a keyboard.','real','Android + iOS'],
['weather','Weather','⛅','#38bdf8','Tools','Forecast for your day.','real','Android + iOS'],
['photos','Photos','🖼️','#f43f5e','Creative','Your pictures.','shell','Android + iOS'],
['camera','Camera','📷','#475569','Creative','Capture moments.','shell','Android + iOS'],
['maps','Maps','🗺️','#16a34a','Travel','Find your way.','shell','Android + iOS'],
['mail','Fibbe Mail','✉️','#0ea5e9','Productivity','Email with your @fibbe.mail address.','real','Android + iOS'],
['browser','Browser','🌐','#2563eb','Internet','Browse the Fibbe web.','real','Android + iOS'],
['msgs','Messages','💬','#22c55e','Social','Chat with friends.','shell','Android + iOS'],
['cal','Calendar','📅','#ef4444','Productivity','Plan your week.','shell','Android + iOS'],
['music','Tunes','🎧','#d946ef','Music','Stream music.','shell','Android + iOS'],
['video','Streamr','🎬','#dc2626','Entertainment','Watch videos.','shell','Android + iOS'],
['pod','Podcasts','🎙️','#a855f7','Music','Shows on demand.','shell','Android + iOS'],
['books','Books','📚','#d97706','Reading','Read anywhere.','shell','Android + iOS'],
['news','Daily News','📰','#64748b','Reading','Top stories.','shell','Android + iOS'],
['chirp','Chirp','🐦','#0284c7','Social','Short posts.','shell','Android + iOS'],
['snap','Snapline','👻','#eab308','Social','Disappearing photos.','shell','Android + iOS'],
['reels','Reelz','🎞️','#e11d48','Social','Short videos.','shell','Android + iOS'],
['ride','Ride','🚗','#0f172a','Travel','Get a ride.','shell','Android + iOS'],
['food','Foodie','🍔','#f97316','Lifestyle','Order dinner.','shell','Android + iOS'],
['shop','Cartly','🛒','#14b8a6','Lifestyle','Shop anything.','shell','Android + iOS'],
['bank','Vaultly','🏦','#1d4ed8','Finance','Bank on the go.','shell','Android + iOS'],
['wallet','Wallet','💳','#334155','Finance','Pay with a tap.','shell','Android + iOS'],
['health','Health','❤️','#fb7185','Health','Track your wellbeing.','shell','Android + iOS'],
['fit','Fitrun','🏃','#84cc16','Health','Log workouts.','shell','Android + iOS'],
['docs','Docs','📄','#2563eb','Productivity','Write documents.','shell','Android + iOS'],
['sheets','Sheets','📊','#15803d','Productivity','Spreadsheets.','shell','Android + iOS'],
['drive','Cloud Drive','☁️','#0891b2','Productivity','Store files.','shell','Android + iOS'],
['trans','Translate','🌐','#4f46e5','Tools','Speak any language.','shell','Android + iOS'],
['chess','Chess','♟️','#57534e','Games','Classic strategy.','shell','Android + iOS'],
['race','Turbo','🏎️','#b91c1c','Games','Arcade racing.','shell','Android + iOS'],
['puzzle','Blocks','🧩','#9333ea','Games','Puzzle time.','shell','Android + iOS'],
['meet','Meet','📹','#0d9488','Social','Video calls.','shell','Android + iOS']
];
const app=id=>A.find(a=>a[0]===id);
const ico=(a,c='ai')=>`<i class="${c}" style="background:${a[3]};display:grid;place-items:center;border-radius:12px;font-style:normal">${a[2]}</i>`;

// ---------- Power states ----------
function black(msg){os.innerHTML=`<div class="full" id="blk" style="background:#000;color:#333;font-size:12px;cursor:pointer">${msg||''}</div>`;if(msg)$('#blk').onclick=()=>power(1)}
function power(on){if(!on)return black('Fibbe is off · click to power on');black();setTimeout(boot,1800)}
function boot(){os.innerHTML=`<div class="full" id="boot"><div class="logo">Fibbe</div><div class="pb"><i></i></div><p style="color:#888">Starting Fibbe OS…</p></div>`;setTimeout(()=>S.done?(S.pin?login():desktop()):setup(0),3500)}

// ---------- Setup ----------
const WIFI=['Home-5G','Fibbe-Guest','Coffee Shop','Skip for now'];
function dflt(c){S.child=c;S.web='std';S.cats=c?{adult:1,gambling:1,violence:1}:{};S.safeSearch=c;S.askInstall=c;S.limit=c?120:0;S.blockApps=c?['term','taskman','settings','parent']:[]}
function setup(s){
 if(S.web===undefined)dflt(false);
 S.cats=S.cats||{};S.blockSites=S.blockSites||[];S.allowSites=S.allowSites||[];S.blockApps=S.blockApps||[];const ch=!!S.child;
 const ck=(k,l,on,at)=>`<label class="opt" style="display:flex;gap:10px;align-items:center"><input type="checkbox" ${at||'data-k'}="${k}" ${on?'checked':''} style="width:auto;margin:0"> ${l}</label>`;
 const ap=(id,on)=>ck(id,app(id)[2]+' '+app(id)[1],on,'data-a');
 const L=t=>t.split('\n').map(x=>x.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0]).filter(Boolean);
 const st=[
 ()=>`<div class="logo" style="font-size:54px">Fibbe</div><h1>Welcome</h1><p>Let’s set up your computer.</p><select id="lg"><option>English</option><option>Español</option><option>Français</option><option>Deutsch</option></select><select id="rg"><option>United States</option><option>United Kingdom</option><option>Canada</option><option>Australia</option><option>Other</option></select><select id="tf"><option value="12">12-hour clock</option><option value="24" ${S.h24?'selected':''}>24-hour clock</option></select>`,
 ()=>`<h1>Create your Wi‑Fi</h1><p>Make your own network. It connects right away.</p>${S.wifi.map(w=>`<div class="opt ${S.conn===w.n?'on':''}">📶 ${esc(w.n)}${w.p?' 🔒':''}${S.conn===w.n?' · Connected':''}</div>`).join('')}<input id="wn" placeholder="Network name"><input id="wp" placeholder="Password (optional)"><button class="b g" id="wa">Add &amp; connect</button>`,
 ()=>`<h1>Who is this account for?</h1><div class="opt ${ch?'':'on'}" data-ty="a">🧑 <b>Adult account</b><p>Full access. You can still turn on web protection.</p></div><div class="opt ${ch?'on':''}" data-ty="c">🧒 <b>Child account</b><p>Blocks dangerous websites. A parent manages it with a PIN.</p></div>`,
 ()=>`<h1>${ch?'The child’s account':'Your account'}</h1><input id="n" placeholder="${ch?'Child’s name':'Your name'}" value="${esc(S.name)}"><input id="u" placeholder="Username" value="${esc(S.user||'')}">`,
 ()=>`<h1>Set a password</h1><p>Used to sign in. Leave empty for none.</p><input id="pw" type="password" placeholder="Password" value="${esc(S.pin||'')}">`,
 ()=>`<h1>Set up email</h1><p>Pick a Fibbe Mail address.</p><div class="row"><input id="em" placeholder="name" value="${esc((S.mail||'').split('@')[0])}"><b>@fibbe.mail</b></div>`,
 ()=>ch?`<h1>Parent or guardian</h1><p>The parent PIN unlocks Parental Controls. Keep it secret.</p><input id="pn" placeholder="Parent’s name" value="${esc(S.parentName||'')}"><input id="pp" type="password" placeholder="Parent PIN (4+ characters)" value="${esc(S.parentPin||'')}">`:`<h1>Admin PIN (optional)</h1><p>Protects Parental Controls if you add a child account later.</p><input id="pp" type="password" placeholder="Admin PIN (4+ characters)" value="${esc(S.parentPin||'')}">`,
 ()=>`<h1>Web protection</h1>${!ch?`<div class="opt ${S.web==='off'?'on':''}" data-w="off"><b>Off</b><p>No filtering.</p></div>`:''}<div class="opt ${S.web==='std'?'on':''}" data-w="std"><b>Standard</b><p>Blocks dangerous sites and the categories you pick next.</p></div><div class="opt ${S.web==='strict'?'on':''}" data-w="strict"><b>Strict</b><p>Only approved sites can be opened.</p></div>`,
 ()=>`<h1>Blocked categories</h1>${Object.keys(CATN).map(c=>ck(c,CATN[c],S.cats[c],'data-cat')).join('')}`,
 ()=>`<h1>Specific sites</h1><p>Always block (one per line)</p><textarea id="bs" rows="3" placeholder="example.com">${esc(S.blockSites.join('\n'))}</textarea><p>Always allow — used in Strict mode</p><textarea id="as" rows="3" placeholder="example.org">${esc(S.allowSites.join('\n'))}</textarea>`,
 ()=>`<h1>Searching &amp; installing</h1>${ck('ss','Block adult searches',S.safeSearch,'id')}${ck('ai','Ask for the parent PIN before installing apps',S.askInstall,'id')}`,
 ()=>`<h1>Screen time</h1><p>Daily limit for child accounts. A parent can add more time with the PIN.</p><select id="lim">${[0,30,60,90,120,180].map(m=>`<option value="${m}" ${S.limit===m?'selected':''}>${m?m+' minutes a day':'No limit'}</option>`).join('')}</select>`,
 ()=>`<h1>App access</h1><p>Apps a child account needs the parent PIN to open.</p>${APPOPT.map(a=>ck(a[0],a[1],S.blockApps.includes(a[0]),'data-ba')).join('')}`,
 ()=>`<h1>Privacy</h1>${ck('loc','Location services',S.priv.loc)}${ck('diag','Share diagnostics',S.priv.diag)}${ck('ads','Personalized suggestions',S.priv.ads)}`,
 ()=>`<h1>Look &amp; feel</h1><div class="opt ${S.theme==='dark'?'on':''}" data-th="dark">🌙 Dark</div><div class="opt ${S.theme==='light'?'on':''}" data-th="light">☀️ Light</div><div class="row" style="justify-content:flex-start">${['#7c5cff','#ff6ec7','#22c55e','#f59e0b','#0ea5e9'].map(c=>`<button data-c="${c}" style="width:40px;height:40px;border-radius:50%;border:0;background:${c};cursor:pointer"></button>`).join('')}</div>`,
 ()=>`<h1>Choose your apps</h1>${['browser','mail','msgs','notes','calc','clock','paint','ttt','todo','piano','weather'].filter(id=>!(ch&&S.blockApps.includes(id))).map(id=>ap(id,['browser','mail','notes','calc','clock'].includes(id))).join('')}`,
 ()=>`<div style="font-size:54px">🎉</div><h1>You’re all set, ${esc(S.name)}!</h1><p>${ch?'🧒 Child account · managed by '+esc(S.parentName):'🧑 Adult account'}<br>Web protection: ${({off:'Off',std:'Standard',strict:'Strict'})[S.web]}${ch&&S.limit?' · '+S.limit+' min a day':''}<br>Wi‑Fi: ${esc(S.conn||'not connected')} · Email: ${esc(S.mail)}</p>`];
 os.innerHTML=`<div class="full" id="setup"><div class="wiz" style="max-height:92vh;overflow:auto"><p class="mut">Step ${s+1} of 17</p>${st[s]()}<div class="row"><button class="b g" id="bk" ${s?'':'style="visibility:hidden"'}>Back</button><button class="b" id="nx">${s===16?'Start using Fibbe':'Next'}</button></div></div></div>`;
 const v=$('#setup'),g=i=>v.querySelector(i);
 v.querySelectorAll('[data-ty]').forEach(o=>o.onclick=()=>{dflt(o.dataset.ty==='c');setup(s)});
 v.querySelectorAll('[data-w]').forEach(o=>o.onclick=()=>{S.web=o.dataset.w;setup(s)});
 v.querySelectorAll('[data-th]').forEach(o=>o.onclick=()=>{S.theme=o.dataset.th;skin();v.querySelectorAll('[data-th]').forEach(x=>x.classList.toggle('on',x===o))});
 v.querySelectorAll('[data-c]').forEach(o=>o.onclick=()=>{S.ac=o.dataset.c;skin()});
 if(g('#wa'))g('#wa').onclick=()=>{const n=g('#wn').value.trim();if(!n)return toast('Name your network');if(S.wifi.some(w=>w.n===n))return toast('That name is taken');S.wifi.push({n,p:g('#wp').value});S.conn=n;save();setup(s)};
 g('#bk').onclick=()=>setup(s-1);
 g('#nx').onclick=()=>{
  if(s===0)S.h24=g('#tf').value==='24';
  if(s===3){const n=g('#n').value.trim();if(!n)return toast('Enter a name');S.name=n;S.user=g('#u').value.trim()||n.toLowerCase()}
  if(s===4)S.pin=g('#pw').value;
  if(s===5){const e=g('#em').value.trim().toLowerCase().replace(/[^a-z0-9._]/g,'');if(!e)return toast('Choose an email name');S.mail=e+'@fibbe.mail'}
  if(s===6){const p=g('#pp').value.trim();if(ch){const n=g('#pn').value.trim();if(!n)return toast('Enter the parent’s name');if(p.length<4)return toast('The PIN needs 4+ characters');S.parentName=n}else if(p&&p.length<4)return toast('The PIN needs 4+ characters');S.parentPin=p}
  if(s===8)S.cats=Object.fromEntries([...v.querySelectorAll('[data-cat]')].map(c=>[c.dataset.cat,c.checked?1:0]));
  if(s===9){S.blockSites=L(g('#bs').value);S.allowSites=L(g('#as').value)}
  if(s===10){S.safeSearch=g('#ss').checked;S.askInstall=g('#ai').checked}
  if(s===11)S.limit=+g('#lim').value;
  if(s===12)S.blockApps=[...v.querySelectorAll('[data-ba]')].filter(c=>c.checked).map(c=>c.dataset.ba);
